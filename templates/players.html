
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Player Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <div class="content">

            <p class="tagline">LET THE CHALLENGE BEGIN</p>

            <h1>Meet Your <span>Opponents.</span></h1>

            <p class="description">
                Enter the names of both players to begin.
            </p>

            <form action="{{ url_for('players') }}" method="POST">

                <div class="form-group">
                    <label for="player1">PLAYER 1</label>
                    <input type="text"
                           id="player1"
                           name="player1"
                           placeholder="Enter Player 1 name"
                           required>
                </div>

                <div class="form-group">
                    <label for="player2">PLAYER 2</label>
                    <input type="text"
                           id="player2"
                           name="player2"
                           placeholder="Enter Player 2 name"
                           required>
                </div>

                <button type="submit" class="start-btn">
                    Continue →
                </button>

            </form>

        </div>

    </div>

</body>
</html>
